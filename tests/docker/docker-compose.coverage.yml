# Override applied when KAFNUS_TESTS_COVERAGE=true.
# Attaches the JaCoCo agent to Kafnus Connect so E2E tests generate coverage
# for the custom SMTs. Execution data is written to tests/coverage/jacoco-e2e.exec
# when the JVM shuts down.

services:
  kafnus-connect:
    environment:
      KAFKA_OPTS: "-javaagent:/jacoco/jacocoagent.jar=destfile=/jacoco/jacoco-e2e.exec,append=true,includes=com.telefonica.*"
    volumes:
      - ../coverage:/jacoco
    # Leave time for a graceful shutdown, execution data is dumped on JVM exit
    stop_grace_period: 60s
